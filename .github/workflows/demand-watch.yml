# Weekly demand watch.
#
# Answers one question: has anyone hit the Lazaretto credit paywall while there
# is still no way for a human to pay by card. It runs on GitHub's runners
# because they have open internet: Claude cloud sessions cannot reach
# lazaretto.dev at all (the sandbox egress proxy refuses the domain for both
# curl and WebFetch), so no scheduled agent can perform this check itself.
#
# It reads only the PUBLIC boolean endpoint, so this workflow needs no secrets.
# Signal and failure both open a labelled issue, which GitHub emails to the
# owner. A quiet week is deliberately silent; the job summary always records
# what was seen.
name: Demand watch

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Test the alert paths without touching production data'
        required: false
        default: 'off'
        type: choice
        options: ['off', 'waiting', 'quiet', 'unreachable']

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the public demand signal
        id: read
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: |
          # Dispatch-only rehearsal of each branch. Never active on the schedule,
          # so a real signal can never be faked by a scheduled run.
          if [ "${SIMULATE:-off}" = "unreachable" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "detail=SIMULATED failure (manual dispatch)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${SIMULATE:-off}" = "waiting" ] || [ "${SIMULATE:-off}" = "quiet" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "waiting=$([ "$SIMULATE" = "waiting" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "card=false" >> "$GITHUB_OUTPUT"
            echo "x402=true" >> "$GITHUB_OUTPUT"
            echo "simulated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          body=$(curl -fsS --max-time 20 https://lazaretto.dev/v1/demand-status)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "detail=curl exited $rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"
          echo "waiting=$(echo "$body" | jq -r '.demand_waiting')" >> "$GITHUB_OUTPUT"
          echo "card=$(echo "$body" | jq -r '.card_checkout_live')" >> "$GITHUB_OUTPUT"
          echo "x402=$(echo "$body" | jq -r '.x402_live')" >> "$GITHUB_OUTPUT"
          echo "raw<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Decide and notify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REACHABLE: ${{ steps.read.outputs.reachable }}
          WAITING: ${{ steps.read.outputs.waiting }}
          CARD: ${{ steps.read.outputs.card }}
          X402: ${{ steps.read.outputs.x402 }}
          DETAIL: ${{ steps.read.outputs.detail }}
          SIMULATED: ${{ steps.read.outputs.simulated }}
          RAW: ${{ steps.read.outputs.raw }}
        run: |
          set -euo pipefail
          # A rehearsal must never look like a real alert.
          if [ "${SIMULATED:-}" = "true" ] || [ "${DETAIL:-}" != "${DETAIL#SIMULATED}" ]; then
            PREFIX="[TEST] "
            NOTE="

          This is a REHEARSAL from a manual dispatch, not a real signal. Close it."
          else
            PREFIX=""
            NOTE=""
          fi

          open_issue() { # title, body
            existing=$(gh issue list --repo "$REPO" --label demand-watch --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$2${NOTE}"
              echo "commented on existing issue #$existing"
            else
              gh issue create --repo "$REPO" --label demand-watch --title "${PREFIX}$1" --body "$2${NOTE}"
            fi
          }

          if [ "$REACHABLE" != "true" ]; then
            echo "### Demand watch FAILED" >> "$GITHUB_STEP_SUMMARY"
            open_issue "Demand watch could not reach the API" \
          "The weekly demand check could not read https://lazaretto.dev/v1/demand-status ($DETAIL).

          That is either an outage or a DNS/TLS problem. Check https://lazaretto.dev/v1/health before assuming anything about demand.

          This issue is filed by .github/workflows/demand-watch.yml. Close it once the endpoint answers again."
            exit 0
          fi

          {
            echo "### Demand watch"
            echo ""
            echo "- someone waiting to pay: \`$WAITING\`"
            echo "- card checkout live: \`$CARD\`"
            echo "- x402 (agent payments) live: \`$X402\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CARD" = "true" ]; then
            existing=$(gh issue list --repo "$REPO" --label demand-watch --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "Card checkout is live, so this is resolved."
            fi
            exit 0
          fi

          if [ "$WAITING" = "true" ]; then
            open_issue "Someone is waiting to pay: decide on card checkout" \
          "At least one caller has hit the Lazaretto credit paywall, and there is currently NO way for a human to pay: card checkout is built and deployed but switched off.

          Two steps to turn it on:

          1. Create a Stripe account for Meridian Bridge Advisors LLC at https://dashboard.stripe.com/register . Live mode needs the company bank account linked, and verification takes a day or two.
          2. Start a Claude Code session in the lazaretto repo and say 'turn on card checkout'. One command sets the secret and /buy goes live.

          Exact paywall counts are not published; they are in the admin view at https://lazaretto.dev/v1/health with the metrics bearer.

          Filed automatically by .github/workflows/demand-watch.yml."
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Quiet week, nobody has hit the paywall. No issue filed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # PulseMCP is one of the largest MCP directories and we are not in it. Its
  # submissions are paused and its public API returns 410 Gone, so there is
  # nothing to submit: it is rebuilding ingestion. It tells submitters to
  # publish to the official MCP registry instead, which we have done, so the
  # useful move is to notice the moment it reopens rather than checking by
  # hand forever. Files an issue once, when something actually changes.
  pulsemcp:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check whether PulseMCP has reopened
        id: probe
        run: |
          set +e
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 'https://api.pulsemcp.com/v0beta/servers?count_per_page=1')
          body=$(curl -s --max-time 20 'https://api.pulsemcp.com/v0beta/servers?count_per_page=1')
          listed=$(curl -s --max-time 20 'https://api.pulsemcp.com/v0beta/servers?query=lazaretto' | grep -c lazaretto)
          set -e
          # A 200 is NOT the signal: their API answered 200 while returning an
          # empty index and no total_count, with submissions still paused. The
          # signal that ingestion is actually running is a POPULATED index.
          total=$(echo "$body" | jq -r '.total_count // 0')
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
          {
            echo "### PulseMCP"
            echo ""
            echo "- public API status: \`$api\`"
            echo "- servers in their index: \`$total\` (0 means ingestion is not running yet)"
            echo "- lazaretto present: \`$listed\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when it reopens
        if: steps.probe.outputs.api == '200' && steps.probe.outputs.total != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LISTED: ${{ steps.probe.outputs.listed }}
          TOTAL: ${{ steps.probe.outputs.total }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --label pulsemcp --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then echo "already open: #$existing"; exit 0; fi
          gh issue create --repo "$REPO" --label pulsemcp \
            --title "PulseMCP is accepting servers again" \
            --body "PulseMCP's public API is answering again (it had been 410 Gone while they reworked ingestion, with submissions paused).

          Lazaretto present in their index: \`$LISTED\` (0 means still missing).

          They direct submitters to the official MCP registry, where our record is published and complete (io.github.jamesdfinance-dev/lazaretto, with websiteUrl and the remote endpoint), so we may be ingested automatically. If not, submit at https://www.pulsemcp.com/submit .

          Filed automatically by .github/workflows/demand-watch.yml."
