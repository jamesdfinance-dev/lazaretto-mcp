name: Publish to MCP Registry

# Publishes server.json to the official MCP registry using GitHub OIDC. No PAT,
# no device login, no npm: this is a remotes-only server (the hosted endpoint at
# https://lazaretto.dev/mcp), so there is nothing to build or upload. OIDC proves
# this repo belongs to jamesdfinance-dev, which authorizes the
# io.github.jamesdfinance-dev/* namespace. Runs in CI, so it is laptop-independent.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
